name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run sync
      - run: chmod +x android/gradlew
      - name: Version
        run: echo "V=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build signed APK + AAB
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease
      - name: Build debug APK
        if: env.KEYSTORE_BASE64 == ''
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Name artifacts
        run: |
          mkdir out
          if [ -n "$KEYSTORE_BASE64" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk out/datalaw_pdfscanner_${V}.apk
            cp android/app/build/outputs/bundle/release/app-release.aab out/datalaw_pdfscanner_${V}.aab
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk out/datalaw_pdfscanner_${V}_debug.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: datalaw_pdfscanner_${{ env.V }}
          path: out/*
