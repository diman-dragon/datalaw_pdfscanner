name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Version
        run: echo "V=$(grep '^version=' version.properties | cut -d= -f2)" >> "$GITHUB_ENV"
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build signed APK + AAB
        if: env.KEYSTORE_BASE64 != ''
        run: ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Require fixed debug keystore
        if: env.KEYSTORE_BASE64 == ''
        run: test -f debug.keystore || (echo '::error::debug.keystore is not in the repository - commit it, otherwise every build gets a random key and cannot update the installed app' && exit 1)
      - name: Build debug APK
        if: env.KEYSTORE_BASE64 == ''
        run: ./gradlew --no-daemon assembleDebug
      - name: Name artifacts
        run: |
          mkdir out
          if [ -n "$KEYSTORE_BASE64" ]; then
            cp app/build/outputs/apk/release/app-release.apk out/datalaw_pdfscanner_${V}.apk
            cp app/build/outputs/bundle/release/app-release.aab out/datalaw_pdfscanner_${V}.aab
          else
            cp app/build/outputs/apk/debug/app-debug.apk out/datalaw_pdfscanner_${V}_debug.apk
          fi
      - name: Signing certificate (must be the same in every build)
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          for f in out/*.apk; do echo "$f"; "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$f" | grep -i 'SHA-256'; done
      - uses: actions/upload-artifact@v4
        with:
          name: datalaw_pdfscanner_${{ env.V }}
          path: out/*
