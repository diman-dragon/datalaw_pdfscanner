<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>PDF Scanner</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/library.css">
<link rel="stylesheet" href="css/scan.css">
<link rel="stylesheet" href="css/viewer.css">
<link rel="stylesheet" href="css/tools.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<div id="app">
  <header><h1 id="title"></h1></header>
  <main id="pager">
    <section class="page" data-page="library">
      <div id="lib-bar" hidden>
        <div class="seg" id="lib-view"><button data-value="list" data-i18n-aria="lib.list"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><rect x="3" y="5" width="18" height="3" rx="1.5"/><rect x="3" y="10.5" width="18" height="3" rx="1.5"/><rect x="3" y="16" width="18" height="3" rx="1.5"/></svg></button><button data-value="cards" data-i18n-aria="lib.cards"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg></button></div>
        <button class="btn" id="lib-add" data-i18n="lib.add"></button>
      </div>
      <div id="lib-items" hidden></div>
      <div id="lib-empty" class="empty"><img class="em" src="img/emoji/1f4da.svg" alt=""><p id="lib-empty-title"></p><p id="lib-empty-hint"></p><button class="btn" id="lib-choose" data-i18n="lib.choose"></button></div>
    </section>
    <section class="page" data-page="quick">
      <div class="scan-home">
        <img class="em" src="img/emoji/26a1.svg" alt="">
        <p data-i18n="quick.hint"></p>
        <button class="btn" id="quick-shoot" data-i18n="scan.shoot"></button>
        <p id="quick-target"></p>
        <input type="file" id="quick-cam" accept="image/*" capture="environment" hidden>
      </div>
    </section>
    <section class="page" data-page="scan">
      <div id="sc-home" class="scan-home">
        <img class="em" src="img/emoji/1f4f7.svg" alt="">
        <div id="sc-types" class="types"></div>
        <p data-i18n="scan.hint2"></p>
        <button class="btn" id="sc-shoot" data-i18n="scan.shoot"></button>
        <button class="btn ghost" id="sc-gallery" data-i18n="scan.gallery"></button>
        <p id="sc-target"></p>
      </div>
      <div id="sc-session" hidden>
        <div id="sc-bar"><span id="sc-count"></span><button class="btn ghost" id="sc-clear" data-i18n="sc.clear"></button></div>
        <div id="sc-grid"></div>
        <div id="sc-actions">
          <button class="btn ghost" id="sc-add" data-i18n="sc.add"></button>
          <button class="btn ghost" id="sc-add-gallery" data-i18n="scan.gallery"></button>
          <button class="btn" id="sc-save" data-i18n="sc.save"></button>
        </div>
      </div>
      <input type="file" id="sc-cam" accept="image/*" capture="environment" hidden>
      <input type="file" id="sc-pick" accept="image/*" multiple hidden>
    </section>
    <section class="page" data-page="settings">
      <div id="set-tabs"><button data-i="0" class="on" data-i18n="set.s.shoot"></button><button data-i="1" data-i18n="set.s.pdf"></button><button data-i="2" data-i18n="set.s.app"></button></div>
      <div id="set-pager"><div id="set-track">
        <div class="set-screen">
          <div class="row"><span data-i18n="set.delay"></span>
            <div class="seg" data-setting="delay"><button data-value="3">3</button><button data-value="5">5</button><button data-value="10">10</button></div></div>
          <div class="row"><span data-i18n="set.series"></span>
            <div class="seg" data-setting="series"><button data-value="1">1</button><button data-value="3">3</button><button data-value="5">5</button></div></div>
        </div>
        <div class="set-screen">
          <div class="row"><div><div data-i18n="set.folder"></div><div id="folder-name" class="strong"></div><div id="folder-path" class="small muted"></div></div><button class="btn" id="folder-pick" data-i18n="set.folderpick"></button></div>
          <div class="row"><span data-i18n="set.pdfdpi"></span>
            <div class="seg" data-setting="pdfdpi"><button data-value="150">150</button><button data-value="300">300</button><button data-value="600">600</button></div></div>
          <div class="row"><span data-i18n="set.pdfsearch"></span>
            <div class="seg" data-setting="pdfsearch"><button data-value="0" data-i18n="set.off"></button><button data-value="1" data-i18n="set.on"></button></div></div>
        </div>
        <div class="set-screen">
          <div class="row"><span data-i18n="set.theme"></span>
            <div class="seg" data-setting="theme"><button data-value="light" data-i18n="set.light"></button><button data-value="dark" data-i18n="set.dark"></button></div></div>
          <div class="row"><span data-i18n="set.lang"></span>
            <div class="seg" data-setting="lang"><button data-value="auto" data-i18n="set.auto"></button><button data-value="ru">Русский</button><button data-value="en">English</button></div></div>
          <div id="about">
            <div class="about-cap" data-i18n="about.title"></div>
            <div class="about-name">DataLaw DesignLab</div>
            <div class="about-app">PDF Scanner · <span id="ver"></span></div>
            <div class="about-copy">© 2026 DataLaw DesignLab.<br><span data-i18n="about.rights"></span></div>
          </div>
        </div>
      </div></div>
    </section>
  </main>
  <nav id="tabbar">
    <button data-tab="library" data-i18n-aria="tab.library"><img src="img/emoji/1f4da.svg" alt=""><span data-i18n="nav.library"></span></button>
    <button data-tab="quick" data-i18n-aria="tab.quick"><img src="img/emoji/26a1.svg" alt=""><span data-i18n="nav.quick"></span></button>
    <button data-tab="scan" data-i18n-aria="tab.scan"><img src="img/emoji/1f4f7.svg" alt=""><span data-i18n="nav.scan"></span></button>
    <button data-tab="settings" data-i18n-aria="tab.settings"><img src="img/emoji/2699.svg" alt=""><span data-i18n="nav.settings"></span></button>
  </nav>
</div>
<div id="camera" hidden>
  <div id="cam-count" hidden></div>
  <div id="cam-warn" hidden></div>
  <button id="cam-torch" hidden data-i18n-aria="cam.torch"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M13 2L5 14h5l-1 8 8-12h-5z"/></svg></button>
  <div class="ed-head" id="cam-title"></div>
  <div id="cam-stage"><div id="cam-wrap"><video id="cam-video" playsinline muted autoplay></video><canvas id="cam-overlay"></canvas><div id="cam-tick" hidden></div><div id="cam-focus"></div></div></div>
  <div id="cam-frames"></div>
  <div id="cam-coach"></div>
  <div id="cam-bar">
    <button class="btn ghost" id="cam-cancel" data-i18n="ed.cancel"></button>
    <button id="cam-shot" aria-label="Shoot"></button>
    <button class="btn ghost" id="cam-timer"></button>
  </div>
</div>
<div id="result" hidden>
  <div class="ed-head"><span data-i18n="rs.title"></span>
    <button id="rs-del" class="vw-btn" data-i18n-aria="sc.delete" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
  </div>
  <div id="rs-stage"><canvas id="rs-canvas"></canvas><canvas id="rs-mini" hidden></canvas></div>
  <div id="rs-alts" hidden></div>
  <p id="rs-hint" data-i18n="rs.hint"></p>
  <p id="rs-caption" hidden></p>
  <div id="rs-panel">
    <div class="seg" id="rs-look"></div>
    <div class="rs-rot">
      <button id="rs-left" class="rs-ic" data-i18n-aria="rs.rotl"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg></button>
      <button id="rs-right" class="rs-ic" data-i18n-aria="rs.rotr"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg></button>
    </div>
  </div>
  <div id="rs-bar">
    <button class="btn" id="rs-save" data-i18n="rs.save"></button>
    <button class="btn ghost" id="rs-back" data-i18n="rs.back" hidden></button>
    <button class="btn ghost" id="rs-retake" data-i18n="rs.retake"></button>
  </div>
</div>
<div id="qcam" hidden>
  <video id="qcam-video" playsinline muted autoplay></video>
  <button id="qcam-close" aria-label="Close"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  <div id="qcam-focus"></div>
  <div id="qcam-status"></div>
  <button id="qcam-shot" aria-label="Shoot"></button>
</div>
<div id="viewer" hidden>
  <div class="ed-head vw-head">
    <button id="vw-close" class="vw-btn" data-i18n-aria="vw.close"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    <span id="vw-title"></span><span id="vw-pos" class="muted"></span>
    <button id="vw-menu" class="vw-btn" data-i18n-aria="vw.menu"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
  </div>
  <div id="vw-scroll"><div id="vw-pages"></div></div>
  <div id="vw-bar">
    <button class="btn ghost" id="vw-minus" data-i18n-aria="vw.zoomout">−</button>
    <span id="vw-zoom"></span>
    <button class="btn ghost" id="vw-plus" data-i18n-aria="vw.zoomin">+</button>
    <button class="btn ghost" id="vw-prev" data-i18n-aria="vw.prev"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="btn ghost" id="vw-next" data-i18n-aria="vw.next"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="btn ghost" id="vw-mode" data-i18n-aria="vw.mode">
      <svg class="ic-strip" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><rect x="5" y="3" width="14" height="8" rx="1.5"/><rect x="5" y="13" width="14" height="8" rx="1.5"/></svg>
      <svg class="ic-paged" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="4" width="10" height="16" rx="1.5"/><path d="M3.5 9L2 12l1.5 3M20.5 9L22 12l-1.5 3"/></svg>
    </button>
    <button class="btn ghost" id="vw-edit" data-i18n-aria="vw.editpage"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg></button>
  </div>
</div>
<div id="ocr" hidden>
  <div class="ed-head vw-head">
    <button id="ocr-close" class="vw-btn" data-i18n-aria="vw.close"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    <span data-i18n="ocr.title"></span>
  </div>
  <div id="ocr-langs" class="chips"><button data-lang="ru">Русский</button><button data-lang="en">English</button><button data-lang="it">Italiano</button><button data-lang="sr">Српски / Srpski</button></div>
  <div id="ocr-run"><button class="btn" id="ocr-page" data-i18n="ocr.page"></button><button class="btn ghost" id="ocr-all" data-i18n="ocr.all"></button></div>
  <p id="ocr-status" class="small muted"></p>
  <textarea id="ocr-text" spellcheck="false"></textarea>
  <div id="ocr-bar"><button class="btn" id="ocr-copy" data-i18n="ocr.copy"></button></div>
</div>
<div id="docedit" hidden>
  <div class="ed-head" id="de-title"></div>
  <div id="de-grid"></div>
  <div id="de-bar"><button class="btn ghost" id="de-cancel" data-i18n="ed.cancel"></button><button class="btn ghost" id="de-all" data-i18n="de.all"></button><button class="btn" id="de-save" data-i18n="sc.save"></button></div>
</div>
</body>
</html>
